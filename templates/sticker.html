<div class="sticker-container" width="{{ sticker.width }}" height="{{ sticker.height }}">
    <div class="relative flex flex-col text-center rounded-md h-full">
        <button
            class="rounded-md absolute bottom-0 left-0 bg-blue-500 text-white h-6 w-6"
            title="Imprimer"
            aria-label="Imprimer"
            hx-post="{{ url_for('sticker_print', sticker=sticker.relative) }}"
            hx-swap="none"
        >
            {{ icon('ph:printer-bold', classes=["block", "ps-1"]) }}
        </button>
        <button
            class="rounded-md absolute top-0 right-0 text-red-400 text-xs p-0 h-4 w-4"
            title="Supprimer"
            aria-label="Supprimer"
            hx-confirm="T'es sûr·e ?!"
            hx-delete="{{ url_for('sticker_delete', sticker=sticker.relative) }}"
            hx-target="closest .sticker-container"
            hx-swap="delete"
        >
            {{ icon('ph:x-bold', classes=["block"]) }}
        </button>
        <button
            class="rounded-md absolute bottom-0 right-5 border bg-white border-purple-500 text-purple-500 h-5 w-5 mr-0.5 text-sm"
            title="Impression en masse"
            aria-label="Impression en masse"
            hx-on::before:request="resetAndOpenModal()"
            hx-get="{{ url_for('sticker_massprint', sticker=sticker.relative) }}"
            hx-target="#modal"
        >
            {{ icon('ph:stack-bold', classes=["block"], size="1.15em", attrs={"style": "margin-top: 0; margin-left:0.1em;"}) }}
        </button>
        <button 
            class="rounded-md absolute bottom-0 right-0 border bg-white border-blue-500 text-blue-500 h-5 w-5 text-sm"
            title="Éditer"
            aria-label="Éditer"
            hx-on::before:request="resetAndOpenModal()"
            hx-get="{{ url_for('sticker_edit', sticker=sticker.relative) }}"
            hx-target="#modal"
        >
            {{ icon('ph:pencil-simple-bold', classes=["block"], size="1.15em", attrs={"style": "margin-top: 0; margin-left:0.1em;"}) }}
        </button>
        <img
            class="grow max-h-64 object-contain"
            src="{{ url_for('static', filename='uploads/' + sticker.relative) }}"
            width="{{ sticker.width }}"
            height="{{ sticker.height }}"
            loading="lazy"
        >
    </div>
</div>
