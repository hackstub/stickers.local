{% extends "base.html" %}
{% block extrahead %}
<link rel="stylesheet" href="{{ url_for('static', filename='cropper.min.css') }}">
<script src="{{ url_for('static', filename='cropper.min.js') }}"></script>
<script>
var cropper;

document.addEventListener('DOMContentLoaded', function () {
    cropper = new Cropper(document.getElementById("rawscanimg"), {  autoCropArea: 0.5, rotatable: true });
});
function updateCropResult() {
    const canvas = cropper.getCroppedCanvas();
    canvas.toBlob(blob => {
        if (!blob) return;
        const file = new File([blob], `scan-crop-${Date.now()}.jpg`, { type: "image/jpeg" });
        const input = document.getElementById("cropResult");
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        
        input.files = dataTransfer.files;
    
        htmx.trigger("#cropForm", "crop-ready");
    }, "image/jpeg", 0.9);
};
</script>
{% endblock %}
{% block main %}

<div class="text-center">
    <label class="py-3">
      Tourner l'image
      <input class="ps-3" type="range" min="-90" max="90" value="0" oninput="cropper.rotateTo(Number(this.value))">
    </label>
</div>
<div class="text-center" style="max-width: 90%;">
  <img id="rawscanimg" class="mx-auto" src="{{ url_for('static', filename='raw_scan_tmp.jpeg') }}" style="max-width: 90%; max-height: 70%;">

  <form
      id="cropForm"
      hx-trigger="crop-ready"
      hx-post="{{ url_for('sticker_upload') + "?redirect_after=true" }}"
      hx-encoding="multipart/form-data"
      hx-target="body"
      hx-select="body"
  >
      <input id="cropResult" hidden type="file" name="file">
      <button id="confirmCrop" type="button" class="rounded-md bg-blue-500 text-white m-2 px-4 py-2" onclick="updateCropResult()" >
          Sauvegarder
      </button>
  </form>
</div>
{% endblock %}
