<!DOCTYPE html>
<html>

  <head>
    <title>stickers.local</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='fork-awesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='shantell.css') }}">
    <script src="{{ url_for('static', filename='tailwind-css.js') }}"></script>
    <script>
        window.STICKER_PRINT_URL = "{{ url_for('sticker_print') }}";
        window.STICKER_DELETE_URL = "{{ url_for('sticker_delete') }}";
        window.STICKER_SEARCH_URL = "{{ url_for('search') }}";
        window.STICKER_PROCESS_URL = "{{ url_for('sticker_process') }}";
        window.LABEL_GENERATE_URL = "{{ url_for('label_generate') }}";
    </script>
    <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>

  <style type="text/tailwindcss">
        @layer utilities {
          input, textarea, select {
              @apply rounded-md shadow-sm border-gray-200 bg-neutral-50;
          }
          .btn {
              @apply text-sm font-medium rounded-md px-4 py-2 transition hover:brightness-125;
          }
          .btn-sm {
              @apply text-xs font-medium rounded-md px-2 py-2 transition;
          }
          .btn-success {
              @apply text-white bg-green-500 hover:bg-green-700;
          }
          .btn-primary {
              @apply text-white bg-blue-500 hover:bg-blue-700;
          }
          h2 {
              @apply text-2xl font-bold pb-2;
          }
          .modal {
              @apply fixed inset-0 z-[999] h-screen w-screen place-items-center bg-black bg-opacity-30 backdrop-blur-sm transition transition-opacity duration-300
          }
        }
  </style>
  <style>
    body {
        font-family: "Shantell Sans", ui-sans-serif, system-ui, sans-serif;
        font-weight: 500;
    }
    input[type="radio"].custom-radio + label {

        background-color: none;
        padding: 2px 7px;
        border-radius: 5px;
    }
    input[type="radio"].custom-radio:checked + label {
        background-color: #ddd;
        font-weight: bold;
    }
  </style>
  </head>

  <body class="text-gray-700 w-fit sm:w-full" style="background-color: #fdfce3;">

      <main class="mx-auto px-3 max-w-screen-md md:max-w-screen-lg pt-5">
        {% block main %}
        {% endblock %}
      </main>

      <footer class="h-5 my-5 text-center">
        <p>
           Made with <i class='text-red-500 fa fa-heart-o' aria-label='love'></i> using <a class='text-blue-800 dark:text-blue-400' href='https://flask.palletsprojects.com'>Flask</a> and <a class='text-blue-800 dark:text-blue-400' href='https://tailwindcss.com/'>TailwindCSS</a>
        </p>
      </footer>

  </body>
</html>
