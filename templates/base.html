<!DOCTYPE html>
<html>

  <head>
    <title>stickers.local</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='shantell.css') }}">
    <script src="{{ url_for('static', filename='tailwind-css.js') }}"></script>
    <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
    <script>
      function resetAndOpenModal() {
          const modal = document.getElementById('modal');
          modal.innerHTML = 'Chargement...';
          modal.showModal();
      }
      function closeModal() {
          const modal = document.getElementById('modal');
          modal.close();
      }
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        input, textarea, select {
            @apply rounded-md shadow-sm border-gray-200 bg-neutral-50;
        }
        .btn {
            @apply text-sm font-medium rounded-md px-4 py-2 transition hover:brightness-125;
        }
        h2 {
            @apply text-2xl font-bold pb-2;
        }
      }
    </style>
    <style>
      body {
          font-family: "Shantell Sans", ui-sans-serif, system-ui, sans-serif;
          font-weight: 500;
          background-color: #fdfce3;
      }
      input[type="radio"].custom-radio + label {
          background-color: none;
          padding: 2px 7px;
          border-radius: 5px;
      }
      input[type="radio"].custom-radio:checked + label {
          background-color: #ddd;
          font-weight: bold;
      }
      .icon {
          display: inline;
      }
    </style>
  </head>

  <body class="text-gray-700 w-fit sm:w-full">

      <main class="mx-auto px-3 max-w-screen-md md:max-w-screen-lg pt-5">
        {% block main %}
        {% endblock %}
      </main>

      <dialog id="modal" class="m-auto p-4 w-72 backdrop:bg-gray-900/25 rounded-xl text-center" style="background-color: #fdfce3;">
      </dialog>

      <hr class="mx-auto my-5 max-w-screen-md md:max-w-screen-lg"/>

      <footer class="h-5 my-5 text-center">
        <p>
           Made with
           {{ icon('ph:heart-bold', classes=["text-red-500", "mb-1"], attrs={"aria-label": "love"}) }}
           using
           <a class='text-blue-800 dark:text-blue-400' href='https://flask.palletsprojects.com'>Flask</a>,
           <a class='text-blue-800 dark:text-blue-400' href='https://tailwindcss.com/'>TailwindCSS</a>
           and <a class='text-blue-800 dark:text-blue-400' href='https://four.htmx.org/'>HTMX</a>
           ·
           <a class='text-blue-800 dark:text-blue-400' href='https://github.com/hackstub/stickers.local'>Source</a>
        </p>
      </footer>

  </body>
</html>
